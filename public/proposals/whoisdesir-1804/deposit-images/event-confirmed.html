<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Event Confirmed</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0A0D1A; font-family: 'Inter', sans-serif; }
.card {
  width: 500px; height: 500px; border-radius: 28px; overflow: hidden; position: relative;
  background: linear-gradient(135deg, #0A0D1A 0%, #12152A 50%, #1a1040 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: 50px 40px;
}
.orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.12; }
.orb--pink { width: 300px; height: 300px; background: #ED145A; top: -10%; right: -10%; }
.orb--blue { width: 280px; height: 280px; background: #18D8F0; bottom: -10%; left: -10%; }
.content { position: relative; z-index: 1; }
.partners {
  font-family: 'Outfit', sans-serif; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em;
  color: rgba(255,255,255,0.5); margin-bottom: 8px; text-transform: uppercase;
}
.partners strong { color: rgba(255,255,255,0.8); }
.event-name {
  font-family: 'Outfit', sans-serif; font-size: 1.8rem; font-weight: 900; color: white; margin-bottom: 8px;
}
.event-type {
  font-size: 1rem; color: rgba(255,255,255,0.5); margin-bottom: 30px;
}
.date {
  font-family: 'Outfit', sans-serif; font-size: 1.4rem; font-weight: 700; color: white; margin-bottom: 6px;
}
.location { font-size: 0.9rem; color: rgba(255,255,255,0.4); margin-bottom: 30px; }
.badge {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px;
  background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3);
  border-radius: 999px; font-family: 'Outfit', sans-serif; font-weight: 700;
  font-size: 0.95rem; color: #4ADE80; margin-bottom: 30px;
}
.badge-dot {
  width: 10px; height: 10px; background: #10B981; border-radius: 50%;
}
.branding {
  display: flex; align-items: center; gap: 10px; font-family: 'Outfit', sans-serif;
  font-size: 0.8rem; font-weight: 600; color: rgba(255,255,255,0.3);
}
.branding-icon {
  width: 28px; height: 28px; background: linear-gradient(135deg, #ED145A, #18D8F0);
  border-radius: 6px; display: flex; align-items: center; justify-content: center;
  font-size: 0.7rem; color: white;
}
</style>
</head>
<body>
<div class="card">
  <div class="orb orb--pink"></div>
  <div class="orb orb--blue"></div>
  <div class="content">
    <div class="partners"><strong>1804 Haitian Pizza</strong> × WhoIsDésir® Media</div>
    <div class="event-name">Grand Opening</div>
    <div class="event-type">& FIFA World Cup Showcase</div>
    <div class="date">July 18, 2026</div>
    <div class="location">Pompano Beach, FL</div>
    <div class="badge"><span class="badge-dot"></span> Deposit Confirmed</div>
    <div class="branding">
      <div class="branding-icon">📷</div>
      <span>WhoIsDésir® Media</span>
    </div>
  </div>
</div>
</body>
</html>
