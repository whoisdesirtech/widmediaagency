<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit Confirmed</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #0A0D1A; font-family: 'Inter', sans-serif; }
.card {
  width: 800px; min-height: 450px; border-radius: 28px; overflow: hidden; position: relative;
  background: linear-gradient(135deg, #0A0D1A 0%, #12152A 50%, #1a1040 100%);
  display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
  padding: 60px 40px;
}
.orb { position: absolute; border-radius: 50%; filter: blur(100px); opacity: 0.15; }
.orb--pink { width: 400px; height: 400px; background: #ED145A; top: -10%; right: -5%; }
.orb--blue { width: 350px; height: 350px; background: #18D8F0; bottom: -15%; left: -10%; }
.content { position: relative; z-index: 1; }
.check-circle {
  width: 100px; height: 100px; border-radius: 50%; background: linear-gradient(135deg, #10B981 0%, #059669 100%);
  display: flex; align-items: center; justify-content: center; margin: 0 auto 30px;
  box-shadow: 0 0 40px rgba(16,185,129,0.3); font-size: 48px; color: white; font-weight: 700;
}
.label {
  font-family: 'Outfit', sans-serif; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.15em;
  text-transform: uppercase; background: linear-gradient(135deg, #ED145A, #18D8F0);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 12px;
}
h1 {
  font-family: 'Outfit', sans-serif; font-size: 2.8rem; font-weight: 900; color: white;
  margin-bottom: 16px; line-height: 1.1;
}
.amount {
  font-family: 'Outfit', sans-serif; font-size: 1.3rem; color: rgba(255,255,255,0.6); margin-bottom: 8px;
}
.amount strong { color: white; font-size: 1.5rem; }
.subtext { font-size: 0.95rem; color: rgba(255,255,255,0.35); margin-bottom: 40px; }
.branding {
  display: flex; align-items: center; gap: 10px; font-family: 'Outfit', sans-serif;
  font-size: 0.85rem; font-weight: 600; color: rgba(255,255,255,0.4);
}
.branding-icon {
  width: 32px; height: 32px; background: linear-gradient(135deg, #ED145A, #18D8F0);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-size: 0.8rem; color: white;
}
</style>
</head>
<body>
<div class="card">
  <div class="orb orb--pink"></div>
  <div class="orb orb--blue"></div>
  <div class="content">
    <div class="check-circle">✓</div>
    <div class="label">WhoIsDésir® Media × 1804 Haitian Pizza</div>
    <h1>Deposit Received</h1>
    <div class="amount"><strong>$75</strong> of $150 — 50% Paid</div>
    <div class="subtext">Grand Opening & FIFA World Cup Showcase — July 18, 2026</div>
    <div class="branding">
      <div class="branding-icon">📷</div>
      <span>WhoIsDésir® Media</span>
    </div>
  </div>
</div>
</body>
</html>
